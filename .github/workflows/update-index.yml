name: Update Index

on:
  push:
    branches: [claude/github-tutorial-html-C4c23]
    paths:
      - "*.html"
      - "scripts/generate-index.py"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-index]')"
    steps:
      - uses: actions/checkout@v4

      - name: Generate index
        run: python3 scripts/generate-index.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: regenerate index [skip-index]"
            git push
          else
            echo "index.html unchanged"
          fi
